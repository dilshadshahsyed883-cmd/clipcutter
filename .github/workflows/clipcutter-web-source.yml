name: ClipCutter Web source tests
on:
  pull_request:
    paths:
      - 'ClipCutterWeb/**'
      - '.github/workflows/clipcutter-web-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify web source
        run: bash ClipCutterWeb/deploy/test-source.sh
      - name: Verify browser script syntax
        run: node --check ClipCutterWeb/app/static/gpu.js
