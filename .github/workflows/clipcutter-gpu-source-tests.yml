name: ClipCutter GPU source tests (no image build)

on:
  push:
    branches: [main]
    paths:
      - 'ClipCutterGPU/**'
      - '.github/workflows/clipcutter-gpu-source-tests.yml'
  pull_request:
    paths:
      - 'ClipCutterGPU/**'
      - '.github/workflows/clipcutter-gpu-source-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source contracts and synthetic transport regressions
        working-directory: ClipCutterGPU
        run: |
          python -m pip install --only-binary=:all: pydantic==2.13.5 numpy==2.3.5 opencv-python-headless==4.13.0.92
          python -m compileall -q worker tests
          python -m unittest tests.test_transport tests.test_reference_set -v
