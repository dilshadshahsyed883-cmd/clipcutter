name: ClipCutter GPU source tests (no image build)

on:
  push:
    branches: [main]
    paths:
      - 'ClipCutterGPU/**'
      - '.github/workflows/clipcutter-gpu-source-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ClipCutterGPU/**'
      - '.github/workflows/clipcutter-gpu-candidate.yml'
      - '.github/workflows/clipcutter-gpu-source-tests.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source contracts and synthetic transport regressions
        working-directory: ClipCutterGPU
        run: |
          python -m pip install --only-binary=:all: pydantic==2.13.5
          python -m compileall -q worker tests
          python -m unittest tests.test_transport tests.test_runtime tests.test_service tests.test_analyzer_dominance -v
          for script in build-candidate.sh check-main-gpu-tree.sh prepare-seed-models.sh tests/test_gpu_tree_gate.sh; do bash -n "$script"; done
          bash tests/test_gpu_tree_gate.sh
