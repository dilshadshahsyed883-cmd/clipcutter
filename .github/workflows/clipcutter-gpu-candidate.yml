name: ClipCutter GPU candidate

# Owner-approved automatic private educational build; main events only.
on:
  push:
    branches: [main]
    paths:
      - 'ClipCutterGPU/Dockerfile'
      - 'ClipCutterGPU/.dockerignore'
      - 'ClipCutterGPU/requirements.txt'
      - 'ClipCutterGPU/worker/**'
      - 'ClipCutterGPU/tests/**'
      - 'ClipCutterGPU/build-candidate.sh'
      - 'ClipCutterGPU/check-main-gpu-tree.sh'
      - 'ClipCutterGPU/prepare-models.py'
      - 'ClipCutterGPU/verify-private-package.py'
      - 'ClipCutterGPU/prepare-seed-models.sh'
      - '.github/workflows/clipcutter-gpu-candidate.yml'
      - '.github/workflows/clipcutter-gpu-source-tests.yml'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Reviewed exact main commit SHA at dispatch (GPU tree pinned)
        type: string
        required: true
      private_educational_approved:
        description: Owner approves this private educational build and assumes model licensing responsibility
        type: boolean
        required: true
        default: false
      model_drive_id:
        description: Owner-supplied public Drive model ZIP file ID (optional with model URL secret)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: clipcutter-gpu-private-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-tests:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.approved_sha == github.sha && inputs.private_educational_approved))
    uses: ./.github/workflows/clipcutter-gpu-source-tests.yml
    permissions:
      contents: read
  candidate:
    needs: source-tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.approved_sha == github.sha && inputs.private_educational_approved))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private registry before model staging
        env:
          CLIPCUTTER_PACKAGE_VERIFY_TOKEN: ${{ secrets.CLIPCUTTER_PACKAGE_VERIFY_TOKEN }}
        run: python3 ClipCutterGPU/verify-private-package.py
      - name: Check exact candidate tag before staging or building
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/dilshadshahsyed883-cmd/clipcutter-gpu-private-test:$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          if docker manifest inspect "$IMAGE" > /dev/null 2> "$RUNNER_TEMP/registry-check.txt"; then
            echo 'Immutable candidate already exists; refusing duplicate build' >&2
            exit 1
          fi
          grep -Eiq 'manifest unknown|name unknown|no such manifest|manifest.*not found' "$RUNNER_TEMP/registry-check.txt" || { cat "$RUNNER_TEMP/registry-check.txt" >&2; exit 1; }
      - name: Stage and verify models from configured source or private seed
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          CLIPCUTTER_PACKAGE_VERIFY_TOKEN: ${{ secrets.CLIPCUTTER_PACKAGE_VERIFY_TOKEN }}
          CLIPCUTTER_MODEL_DRIVE_ID: ${{ inputs.model_drive_id || secrets.CLIPCUTTER_MODEL_DRIVE_ID }}
          CLIPCUTTER_MODEL_ZIP_URL: ${{ secrets.CLIPCUTTER_MODEL_ZIP_URL }}
        run: |
          set -euo pipefail
          if [[ -n "$CLIPCUTTER_MODEL_DRIVE_ID" || -n "$CLIPCUTTER_MODEL_ZIP_URL" ]]; then
            python3 -m pip install --disable-pip-version-check gdown==5.2.0
            python3 ClipCutterGPU/prepare-models.py
          else
            bash ClipCutterGPU/prepare-seed-models.sh
          fi
      - name: Build and verify exact candidate
        id: build
        shell: bash
        env:
          CLIPCUTTER_PACKAGE_VERIFY_TOKEN: ${{ secrets.CLIPCUTTER_PACKAGE_VERIFY_TOKEN }}
          CLIPCUTTER_FINAL_APPROVED_SHA: ${{ github.sha }}
          CLIPCUTTER_PRIVATE_EDUCATIONAL_APPROVED: '1'
        run: |
          set -euo pipefail
          bash ClipCutterGPU/build-candidate.sh "$GITHUB_SHA"
      - name: Publish validated immutable main candidate
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          CLIPCUTTER_PACKAGE_VERIFY_TOKEN: ${{ secrets.CLIPCUTTER_PACKAGE_VERIFY_TOKEN }}
          IMAGE: ${{ steps.build.outputs.image }}
          REPORT: ${{ steps.build.outputs.report }}
        run: |
          set -euo pipefail
          test "$IMAGE" = "ghcr.io/dilshadshahsyed883-cmd/clipcutter-gpu-private-test:$GITHUB_SHA"
          bash ClipCutterGPU/check-main-gpu-tree.sh "$GITHUB_SHA" https://github.com/dilshadshahsyed883-cmd/clipcutter.git
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          # Do not overwrite a published tag. Only a definitive registry not-found permits push.
          if docker manifest inspect "$IMAGE" > "$REPORT/existing-manifest.json" 2> "$REPORT/registry-check.txt"; then
            echo 'Candidate tag already exists; refusing overwrite' >&2
            exit 1
          fi
          grep -Eiq 'manifest unknown|name unknown|no such manifest|manifest.*not found' "$REPORT/registry-check.txt" || { cat "$REPORT/registry-check.txt" >&2; exit 1; }
          python3 ClipCutterGPU/verify-private-package.py
          # Recheck immediately before publish, not after a potentially long registry check.
          bash ClipCutterGPU/check-main-gpu-tree.sh "$GITHUB_SHA" https://github.com/dilshadshahsyed883-cmd/clipcutter.git
          docker push "$IMAGE"
          python3 ClipCutterGPU/verify-private-package.py
          REFERENCE="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          [[ "$REFERENCE" =~ ^ghcr\.io/dilshadshahsyed883-cmd/clipcutter-gpu-private-test@sha256:[a-f0-9]{64}$ ]]
          docker manifest inspect "$REFERENCE" >/dev/null
          printf '%s\n%s\n' "$IMAGE" "$REFERENCE" > "$REPORT/image-reference.txt"
          export REFERENCE
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["REPORT"])
          d=json.loads((p/"image-smoke.json").read_text())
          assert d["source_sha"]==os.environ["GITHUB_SHA"]
          d.update(image=os.environ["IMAGE"],digest=os.environ["REFERENCE"])
          (p/"image-reference.json").write_text(json.dumps(d,indent=2))
          PY
          printf 'Tag: %s\n\nDigest: %s\n\nPhysical GPU verification: pending. No deployment.\n' "$IMAGE" "$REFERENCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Save image validation report
        if: always() && steps.build.outputs.report != ''
        uses: actions/upload-artifact@v4
        with:
          name: ClipCutter-GPU-image-reference
          path: ${{ steps.build.outputs.report }}
          if-no-files-found: error
      - name: Remove temporary model files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/clipcutter-authorized-models"
